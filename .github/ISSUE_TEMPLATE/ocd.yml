name: Pase a Producción tipo OCD
description: Solicita un OCD. El agente valida riesgo, calendario y aprobadores, y te dice qué falta y cuándo hacerlo.
title: "[OCD] "
labels: ["ocd"]
body:
  - type: input
    id: servicio
    attributes:
      label: Servicio
      description: Nombre del servicio. Ejemplos de la demo, pagos-api, canal-web, core-cuentas, tarjetas-api
    validations:
      required: true
  - type: input
    id: matricula
    attributes:
      label: Matrícula
      description: Tu matrícula de empleado, formato M-12345. El agente verifica con ella que tengas los grupos de red del servicio.
      placeholder: "M-10212"
    validations:
      required: true
  - type: input
    id: historia
    attributes:
      label: Historia asociada
      description: Historia del cambio, formato HU-1234. Si no tienes una, pídele al asistente del portal que te ayude a crearla.
      placeholder: "HU-3101"
    validations:
      required: true
  - type: dropdown
    id: tipo
    attributes:
      label: Tipo de cambio
      description: Estándar (repetible), Normal (planificado, pasa por el CAB) o Emergencia (incidente activo).
      options: [Estándar, Normal, Emergencia]
    validations:
      required: true
  - type: dropdown
    id: modalidad
    attributes:
      label: Modalidad
      description: "Automatizado (todo se ejecuta solo), Manual (lo ejecuta agileOps a mano), Híbrido (pasos [AUTO] y [MANUAL]) o DeployGO (los eventos de git mueven los estados)."
      options: [Automatizado, Manual, Híbrido, DeployGO]
    validations:
      required: true
  - type: dropdown
    id: criticidad
    attributes:
      label: Criticidad del servicio
      options: [Alta, Media, Baja]
    validations:
      required: true
  - type: dropdown
    id: tamano
    attributes:
      label: Tamaño del cambio
      options: [Pequeño, Mediano, Grande]
    validations:
      required: true
  - type: input
    id: fecha
    attributes:
      label: Fecha de ejecución
      description: Noche de la ventana, formato AAAA-MM-DD. Martes a jueves; la ventana empieza ese día a las 22:00 y termina a las 04:00 del día siguiente.
      placeholder: "2026-11-19"
    validations:
      required: true
  - type: input
    id: hora
    attributes:
      label: Hora de inicio
      description: Formato 24 horas HH:MM, entre 22:00 y 04:00.
      placeholder: "22:00"
    validations:
      required: true
  - type: dropdown
    id: rollback
    attributes:
      label: Plan de rollback
      options: ["Sí, probado", "Sí, sin probar", "No"]
    validations:
      required: true
  - type: checkboxes
    id: controles
    attributes:
      label: Evidencias y controles
      description: Marca lo que ya tienes. El agente indica lo que falta.
      options:
        - label: Pruebas QA aprobadas
        - label: SAST sin hallazgos críticos o altos
        - label: SCA sin vulnerabilidades críticas o altas
        - label: Escaneo de secretos limpio
        - label: Aprobación del squad de QA
        - label: Runbook actualizado
        - label: Alertas y monitoreo definidos
        - label: Grupos de red solicitados
        - label: Licencias GitHub y GHAS verificadas
  - type: checkboxes
    id: requisitos
    attributes:
      label: Requisitos del OCD
      options:
        - label: Ventana comunicada a las áreas impactadas
        - label: Plan de verificación posterior definido
  - type: textarea
    id: descripcion
    attributes:
      label: Descripción del cambio
      description: Qué cambia, qué servicios toca y cómo se verifica que salió bien.
  - type: textarea
    id: instrucciones
    attributes:
      label: Instrucciones de despliegue
      description: Opcional al crear. Se piden en las revisiones técnicas, con pasos numerados, rollback y verificación posterior, sin credenciales.
  - type: textarea
    id: congelamiento
    attributes:
      label: Instrucciones de congelamiento
      description: Opcional al crear. Pasos numerados para certificación. En modalidad Híbrido etiqueta cada paso [AUTO] o [MANUAL]. Sin credenciales.
  - type: textarea
    id: reversion_congelamiento
    attributes:
      label: Instrucciones de reversión de congelamiento
      description: Opcional al crear. Cómo se deshace el congelamiento si falla.
  - type: textarea
    id: reversion_despliegue
    attributes:
      label: Instrucciones de reversión de despliegue
      description: Opcional al crear. Cómo se vuelve a la versión anterior en producción si falla.
