name: agente-pase

# Agente de pre-validación: evalúa cada ticket de pase ([Pase]) o de OCD ([OCD]) y publica el informe en el Issue.
on:
  issues:
    types: [opened, edited, reopened]

permissions: {}

concurrency:
  group: agente-pase-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  evaluar:
    if: startsWith(github.event.issue.title, '[Pase]') || startsWith(github.event.issue.title, '[OCD]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      estado: ${{ steps.estado.outputs.estado }}
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Evaluar el pase
        run: node scripts/agent.mjs
      - name: Publicar informe y etiquetas
        run: |
          set -euo pipefail
          gh label create "pase-produccion" --color 1D76DB --force >/dev/null
          gh label create "ocd" --color 8250DF --force >/dev/null
          for l in "riesgo:bajo:2DA44E" "riesgo:medio:D4A72C" "riesgo:alto:E16F24" "riesgo:crítico:CF222E" "bloqueado:CF222E" "listo-para-aprobacion:2DA44E"; do
            name="${l%:*}"; color="${l##*:}"
            gh label create "$name" --color "$color" --force >/dev/null
          done
          for l in "modalidad:automatizado:0969DA" "modalidad:manual:57606A" "modalidad:hibrido:8250DF" "modalidad:deploygo:1A7F37" "estado:inicio:BF8700"; do
            name="${l%:*}"; color="${l##*:}"
            gh label create "$name" --color "$color" --force >/dev/null
          done
          gh issue edit "$ISSUE" --remove-label "riesgo:bajo,riesgo:medio,riesgo:alto,riesgo:crítico,bloqueado,listo-para-aprobacion,modalidad:automatizado,modalidad:manual,modalidad:hibrido,modalidad:deploygo" >/dev/null 2>&1 || true
          gh issue edit "$ISSUE" --add-label "$(cat /tmp/labels.txt)"
          # El informe se actualiza por su marca, no por ser el último comentario (el flujo OCD también comenta).
          id="$(gh api "repos/$GH_REPO/issues/$ISSUE/comments" --paginate --jq '.[] | select(.user.login=="github-actions[bot]" and (.body | contains("<!-- agente-pase -->"))) | .id' | tail -1)"
          if [ -n "$id" ]; then gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" -F body=@/tmp/report.md >/dev/null; else gh issue comment "$ISSUE" --body-file /tmp/report.md; fi
      - name: Estado para el tablero
        id: estado
        run: |
          if grep -q "bloqueado" /tmp/labels.txt; then echo "estado=Bloqueado" >> "$GITHUB_OUTPUT"; else echo "estado=Listo para aprobaciones" >> "$GITHUB_OUTPUT"; fi

  # Mueve la tarjeta en el tablero. El token vive solo en el entorno "kanban" (limitado a main).
  # Solo tickets de personas del equipo, para que desconocidos no llenen el tablero.
  tablero:
    needs: evaluar
    if: contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: kanban
    permissions:
      contents: read
    env:
      PROJECT_OWNER: ${{ github.repository_owner }}
      PROJECT_NUMBER: "1"
      ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
      ESTADO: ${{ needs.evaluar.outputs.estado }}
      GH_PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Mover tarjeta
        run: node scripts/kanban.mjs

  # Espejo en Jira: al crear o editar un [OCD] de una persona del equipo, la tarea aparece (o se actualiza) en el tablero KAN.
  # Las credenciales viven solo en el entorno "jira" (limitado a main). Si Jira falla, la evaluación del pase no se afecta.
  jira:
    needs: evaluar
    if: startsWith(github.event.issue.title, '[OCD]') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: jira
    continue-on-error: true
    permissions:
      contents: read
      issues: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
      JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL || 'https://rochadavid0797.atlassian.net' }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Reflejar el OCD en Jira
        run: node scripts/jira.mjs
